<section
  id="contact"
  class="contact-page"
  data-portfolio-section
  aria-labelledby="contact-title"
  tabindex="-1"
>
  <header class="contact-page__header">
    <div class="flex items-center gap-2 sm:gap-3">
      <app-section-permalink sectionId="contact" />
      <h2 id="contact-title" class="min-w-0 flex-1">{{ t('pages.contact.heading') }}</h2>
    </div>
  </header>

  <article class="card card-border contact-page__panel">
    <div class="card-body contact-page__body">
      <div class="contact-page__beacon" aria-hidden="true">
        <span class="contact-page__beam"></span>
        <span class="contact-page__lantern"></span>
        <span class="contact-page__tower"></span>
        <span class="contact-page__base"></span>
      </div>

      <p>{{ t('pages.contact.placeholder') }}</p>
    </div>
  </article>
</section>
