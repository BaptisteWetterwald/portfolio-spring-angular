<section class="mx-auto max-w-3xl px-6 py-12 sm:py-16" aria-labelledby="page-title">
  <h1
    id="page-title"
    class="text-3xl font-semibold tracking-normal"
    data-route-focus-target
    tabindex="-1"
  >
    {{ t('pages.notFound.heading') }}
  </h1>
  <p class="mt-4 text-base leading-7" style="color: var(--color-text-muted)">
    {{ t('pages.notFound.message') }}
  </p>
  <a class="mt-6 inline-block underline-offset-4 hover:underline" [routerLink]="recoveryPath">
    {{ t(recoveryLabelKey) }}
  </a>
</section>
