<main class="grid min-h-dvh place-items-center bg-base-100 px-6 py-12 text-base-content">
  <section class="max-w-2xl text-center">
    <p class="mb-3 text-sm font-medium uppercase tracking-wider text-base-content/60">Bootstrap</p>
    <h1 class="text-4xl font-semibold tracking-normal">Portfolio application scaffold</h1>
    <p class="mt-4 text-base leading-7 text-base-content/70">
      Angular is ready for future portfolio milestones.
    </p>
    <p
      class="mt-6 inline-flex items-center rounded-md border border-base-300 px-3 py-2 text-sm text-base-content/70"
      [attr.data-backend-state]="backendConnectionState()"
    >
      {{ backendConnectionMessage() }}
    </p>
  </section>
</main>

<router-outlet />
