<footer class="footer sm:footer-horizontal site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__identity">
      <a class="link link-hover site-footer__home" [routerLink]="localizedPath('home')">
        {{ t('site.name') }}
      </a>
      <p class="site-footer__copyright">
        &copy; {{ currentYear }} {{ t('site.name') }}. {{ t('footer.copyright') }}
      </p>
    </div>

    <nav class="site-footer__nav" [attr.aria-label]="t('nav.footer')">
      @for (pageId of navPages; track pageId) {
        <a
          class="link link-hover site-footer__link"
          [class.site-footer__link--active]="isSectionActive(pageId)"
          [attr.href]="sectionHref(pageId)"
          [attr.aria-current]="isSectionActive(pageId) ? 'location' : null"
          (click)="navigateToSection($event, pageId)"
        >
          {{ navLabel(pageId) }}
        </a>
      }
    </nav>
  </div>
</footer>
