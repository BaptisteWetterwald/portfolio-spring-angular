<div class="maritime-floating-controls">
  <div
    class="maritime-floating-controls__sonar"
    [class.maritime-floating-controls__sonar--active]="sonarAvailable()"
    [attr.aria-hidden]="sonarAvailable() ? null : 'true'"
    [attr.inert]="sonarAvailable() ? null : ''"
    (focusin)="handleSonarFocusIn()"
    (focusout)="handleSonarFocusOut($event)"
  >
    <app-sonar-navigation variant="floating" (closed)="handleSonarClosed()" />
  </div>

  <div class="maritime-floating-controls__lighthouse">
    <app-lighthouse-theme-toggle />
  </div>
</div>
