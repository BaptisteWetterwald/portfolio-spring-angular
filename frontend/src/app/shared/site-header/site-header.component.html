<a class="skip-link" href="#main-content">{{ t('nav.skipToContent') }}</a>

<header class="site-header navbar">
  <div class="site-header__inner">
    <div class="site-header__bar">
      <a class="site-header__identity" [routerLink]="localizedPath('home')">
        {{ t('site.name') }}
      </a>

      <nav
        class="site-header__nav"
        [class.site-header__nav--handoff]="floatingNavigationActive()"
        data-primary-nav
        [attr.aria-label]="t('nav.primary')"
        [attr.aria-hidden]="desktopNavigationUnavailable() ? 'true' : null"
        [attr.inert]="desktopNavigationUnavailable() ? '' : null"
        (focusin)="handleDesktopNavigationFocusIn()"
        (focusout)="handleDesktopNavigationFocusOut($event)"
      >
        <ul class="menu menu-horizontal site-header__nav-list">
          @for (pageId of navPages; track pageId) {
            <li>
              <a
                class="site-header__nav-link"
                [class.site-header__nav-link--active]="isSectionActive(pageId)"
                [attr.href]="sectionHref(pageId)"
                [attr.aria-current]="isSectionActive(pageId) ? 'location' : null"
                (click)="handleSectionNavigation($event, pageId)"
              >
                {{ navLabel(pageId) }}
              </a>
            </li>
          }
        </ul>
      </nav>

      <div class="site-header__actions">
        <app-locale-switcher />
        <button
          #mobileMenuButton
          class="btn btn-circle btn-ghost site-header__menu-button"
          type="button"
          [attr.aria-label]="menuButtonLabel()"
          [attr.aria-expanded]="isMobileMenuOpen() ? 'true' : 'false'"
          [attr.aria-controls]="mobileMenuId"
          (click)="toggleMobileMenu()"
        >
          <span class="site-header__menu-icon" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>
      </div>
    </div>

    @if (isMobileMenuOpen()) {
      <nav
        class="site-header__mobile-menu"
        [id]="mobileMenuId"
        [attr.aria-label]="t('nav.primary')"
      >
        <ul class="menu site-header__mobile-list">
          @for (pageId of navPages; track pageId) {
            <li>
              <a
                #mobileNavLink
                class="site-header__mobile-link"
                [class.site-header__mobile-link--active]="isSectionActive(pageId)"
                [attr.href]="sectionHref(pageId)"
                [attr.aria-current]="isSectionActive(pageId) ? 'location' : null"
                (click)="handleSectionNavigation($event, pageId, true)"
              >
                {{ navLabel(pageId) }}
              </a>
            </li>
          }
        </ul>
      </nav>
    }
  </div>
</header>
