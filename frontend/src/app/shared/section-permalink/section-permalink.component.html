<a

  [attr.data-section-id]="sectionId()"
  [attr.href]="href()"
  [attr.aria-label]="accessibleLabel()"
  [attr.title]="accessibleLabel()"
  (click)="handleNavigation($event)"
>

    class="section-permalink__icon"
    viewBox="0 0 24 24"
    fill="none"
    aria-hidden="true"
    focusable="false"
  >
    <circle cx="12" cy="5" r="2.5"></circle>
    <path d="M12 7.5V20.5"></path>
    <path d="M6.5 11H3c0 5.2 4 9.5 9 9.5s9-4.3 9-9.5h-3.5"></path>
    <path d="m3 11 2.5-2.5M21 11l-2.5-2.5"></path>
  </svg>
</a>
