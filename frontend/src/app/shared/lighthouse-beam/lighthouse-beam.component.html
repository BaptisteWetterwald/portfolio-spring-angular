<span
  class="lighthouse-beam"
  [class.lighthouse-beam--ready]="isReady()"
  data-lighthouse-beam-source="floating"
  [attr.data-lighthouse-beam-state]="beamState()"
  [attr.data-lighthouse-beam-motion]="motionState()"
  [style.--lighthouse-beam-origin-x]="originX()"
  [style.--lighthouse-beam-origin-y]="originY()"
  aria-hidden="true"
></span>
