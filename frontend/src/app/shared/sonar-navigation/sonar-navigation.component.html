<nav
  #sonarNav
  [class]="navigationClass()"
  data-sonar-nav
  [attr.data-sonar-nav-variant]="variant()"
  [attr.aria-label]="ariaLabel()"
  (focusin)="handleFloatingFocusIn()"
  (focusout)="handleFloatingFocusOut($event)"
>
  <div #sonarFrame class="sonar-nav__frame">
    <svg class="sonar-nav__svg" viewBox="0 0 100 60" aria-hidden="true" focusable="false">
      <circle class="sonar-nav__ring" cx="50" cy="30" r="8"></circle>
      <circle class="sonar-nav__ring" cx="50" cy="30" r="16"></circle>
      <circle class="sonar-nav__ring" cx="50" cy="30" r="24"></circle>
      <circle class="sonar-nav__core" cx="50" cy="30" r="2.2"></circle>
      <path class="sonar-nav__axis" d="M50 4v52M12 30h76"></path>
      <path class="sonar-nav__axis sonar-nav__axis--diagonal" d="M28 10l44 40M72 10 28 50"></path>
    </svg>

    @if (isFloatingVariant()) {
      <button
        class="btn btn-circle sonar-nav__compact-button"
        type="button"
        [attr.aria-label]="compactButtonLabel()"
        [attr.aria-expanded]="isFloatingExpanded() ? 'true' : 'false'"
        [attr.aria-controls]="listId()"
        (pointerdown)="handleFloatingPointerDown($event)"
        (pointermove)="handleFloatingPointerMove($event)"
        (pointerup)="handleFloatingPointerUp($event)"
        (pointercancel)="handleFloatingPointerCancel($event)"
        (click)="toggleFloatingNavigation($event)"
      >
        <span class="sr-only">{{ compactButtonLabel() }}</span>
      </button>
    }

    <ul
      class="sonar-nav__list"
      [id]="listId()"
      [attr.aria-hidden]="floatingLinksHidden() ? 'true' : null"
    >
      @for (pageId of navPages; track pageId) {
        <li [class]="itemClass(pageId)">
          <a
            class="sonar-nav__link"
            [class.sonar-nav__link--active]="isSectionActive(pageId)"
            [attr.href]="sectionHref(pageId)"
            [attr.aria-current]="isSectionActive(pageId) ? 'location' : null"
            [attr.data-active]="isSectionActive(pageId) ? 'true' : null"
            [attr.tabindex]="floatingLinksHidden() ? '-1' : null"
            (click)="handleSectionNavigation($event, pageId)"
          >
            <span class="sonar-nav__marker" aria-hidden="true"></span>
            <span class="sonar-nav__label">{{ navLabel(pageId) }}</span>
          </a>
        </li>
      }
    </ul>
  </div>
</nav>
