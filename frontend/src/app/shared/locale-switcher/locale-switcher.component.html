<nav class="flex items-center gap-2 text-sm" [attr.aria-label]="t('localeSwitcher.ariaLabel')">
  @for (locale of locales; track locale) {
    <a
      class="underline-offset-4 hover:underline focus:outline-2 focus:outline-offset-2"
      [routerLink]="localePath(locale)"
      [attr.aria-current]="currentLocale() === locale ? 'page' : null"
      [attr.aria-label]="localeAriaLabel(locale)"
      [attr.lang]="locale"
      (click)="switchLocale(locale)"
    >
      {{ localeLabel(locale) }}
    </a>
  }
</nav>
