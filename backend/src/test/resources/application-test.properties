spring.datasource.url=${TEST_SPRING_DATASOURCE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio}}
spring.datasource.username=${TEST_SPRING_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:portfolio}}
spring.datasource.password=${TEST_SPRING_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:portfolio-local-password}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=schema_isolation_required

spring.flyway.enabled=true
spring.flyway.create-schemas=false
spring.flyway.schemas=schema_isolation_required
spring.flyway.default-schema=schema_isolation_required
