spring.application.name=portfolio

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:portfolio}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:portfolio-local-password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway is the schema source of truth. Hibernate validates the migrated schema.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}

# Approved public portfolio identity. A deployment may override it explicitly.
portfolio.github.username=${PORTFOLIO_GITHUB_USERNAME:BaptisteWetterwald}
portfolio.github.token=${PORTFOLIO_GITHUB_TOKEN:}

# Contact defaults to the explicit development sender. Production must select smtp and provide
# the private identities and Spring Mail connection settings through the environment.
portfolio.contact.delivery-mode=${PORTFOLIO_CONTACT_DELIVERY_MODE:log}
portfolio.contact.recipient=${PORTFOLIO_CONTACT_RECIPIENT:}
portfolio.contact.sender=${PORTFOLIO_CONTACT_SENDER:}
portfolio.contact.subject-prefix=${PORTFOLIO_CONTACT_SUBJECT_PREFIX:[Contact Portfolio]}
portfolio.contact.rate-limit.max-submissions=${PORTFOLIO_CONTACT_RATE_LIMIT_MAX_SUBMISSIONS:5}
portfolio.contact.rate-limit.window=${PORTFOLIO_CONTACT_RATE_LIMIT_WINDOW:15m}
portfolio.contact.rate-limit.max-clients=${PORTFOLIO_CONTACT_RATE_LIMIT_MAX_CLIENTS:2048}

# The application reads only the container-resolved remote address. Enable native forwarding only
# when the backend is private behind a trusted reverse proxy that overwrites forwarding headers.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}

spring.mail.default-encoding=UTF-8
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

# Local log/disabled delivery has no SMTP service to probe. Production SMTP deployments can opt in
# after provisioning their provider settings.
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
